     <input  type="text" id="cel" value="" placeholder="celcius"  >  <!--//auto update using onkeypress or onkeyup is equal to oninput -->
    <input type="text" id="Fa" value="" placeholder="Fahrenheit" >

    <!-- <button onclick="tempc()">Fahrenheit</button>
    <button onclick="tempfah()">celcius</button> -->

    <script>

         document.getElementById("cel").addEventListener("keyup",tempc);
         document.getElementById("Fa").addEventListener("keyup",tempfah);

        function tempc(){
            let tempcel= Number(document.getElementById('cel').value);
            let Fahrenheit = (tempcel * 9/5)+ 32;
             console.log(Fahrenheit);
             console.log(document.getElementById("Fa").value=(Fahrenheit));
            
        }
        function tempfah(){
                let Fahrenheit=Number(document.getElementById('Fa').value);  //input box kavalue ko access ker rhe hai
                let celcius=(Fahrenheit-32) * 5/9; // formula
                console.log(celcius);  // print in console
             console.log(document.getElementById("cel").value=(celcius)); // change the value of celcius.

        }
        //  console.log(document.getElementById("cel").value=("Fahrenheit"));
        // console.log(document.getElementById("Fa").value=("Celcius"));
    </script>
