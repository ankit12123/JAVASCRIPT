<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //destructuring for object
        let person={
            Name:"Ankit",
            Age:16,
            City:"Ranchi"
        }
        //make destructuring based on object
        let {Name,Age,City}=person;
        console.log(Name);
        console.log(Age,City);
        
        //destructuring based on arrray
        let a=[1,2,3];
        let[b,c,d]=a;
        console.log(b,d);

        //renaming the destrucring 
        let {Name:n,Age:ag,City:R}=person;
        console.log(n,R);

        //Skip the value in only in array
        let ara=[5,6,7];
        let[g,,f]=ara;
        console.log(g,f);

        //iteration in array using loop
        let ar=["abc",5,"def"];
        for(let i=0;i<3;i=i+1){
            ar[i]=ar[i]+"10";
            console.log(ar[i]);
        }


    </script>
</body>
</html>
